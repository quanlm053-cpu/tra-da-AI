name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: python -m unittest discover -s agent-service/lending -p "test_agent*.py"
      - run: python -m unittest discover -s agent-service/lending -p "test_token_usage.py"
      - run: npm.cmd ci --prefix agent-office --ignore-scripts --no-audit --no-fund
      - run: npm.cmd --prefix agent-office run build
